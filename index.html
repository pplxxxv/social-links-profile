<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Social links profile</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    @font-face {
      font-family: "Inter";
      src: url(Inter-VariableFont_slnt,wght.ttf) format("truetype");
      font-weight: 100 900;
      font-style: normal;
    }
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
   
    body {
      color: hsl(0, 0%, 100%);
      background-color: hsl(0, 0%, 8%);
     font-family: "Inter", sans-serif;
     font-size: 1rem;
     text-align: center;
} 
.card{
  font-weight: 700;
     display: flex;
     flex-direction: column;
     justify-content: center;
     align-items: center;
     background-color: hsl(0, 0%, 12%);
     border-radius: 1rem;
     margin:10rem 1rem 10rem 1rem;
     min-height: 33rem;
}
.boxq {
  font-weight: 600;
  display: block;
  background-color: hsl(0, 0%, 20%);
  padding: 1em;
  margin-block-start: 1.1em;
  width:18rem;
  border-radius: 0.7rem;
}
.p {
  font-weight: 400;
  color: rgb(179, 179, 179);
  margin-bottom: 0rem;
  font-size: 0.9rem;
}
.yellow {
  color:hsl(75, 94%, 57%);
  margin-top: 0rem;
}
h1{
  margin-bottom: 0.4rem;
}
.name {
  margin-bottom: 1.2rem;
}
@media (min-width:37.5rem) {
.card {
  margin: 10rem 28rem;
}
}
      
  </style>
</head>
<body>
<main>
  <div class="card">
  <div class="name">
    <h1>Jessica Randall</h1>
  <p class="yellow">London, United Kingdom</p>
  </div>
 <p class="p"> "Front-end developer and avid reader."</p>
<div class="box">
 <p class="boxq"> GitHub</p>
  <p class="boxq">Frontend Mentor </p>
  <p class="boxq">LinkedIn</p>
 <p class="boxq"> Twitter</p>
  <p class="boxq">Instagram</p>
 </div> 
</div>
</main>
  <footer class="attribution">
  
  </footer>
</body>
</html>
